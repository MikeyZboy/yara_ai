kind = "mobile"
previewPath = "/"
title = "Return Tracker"
version = "1.0.0"
id = "artifacts/return-tracker"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19601

[services.development]
run = "pnpm --filter @workspace/return-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/return-tracker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/return-tracker", "run", "serve" ]

[services.env]
PORT = "19601"
BASE_PATH = "/"
